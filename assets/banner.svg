<svg xmlns="http://www.w3.org/2000/svg" width="840" height="180" viewBox="0 0 840 180">
  <defs>
    <style>
      @font-face { font-family: 'PX'; font-weight: 700; src: url(data:font/woff2;base64,) format('woff2'); }
      @font-face { font-family: 'MONO'; font-weight: 500; src: url(data:font/woff2;base64,) format('woff2'); }
      .name { font-family: 'PX', 'Segoe UI', sans-serif; font-size: 74px; font-weight: 700; letter-spacing: -2px; }
      .tag { font-family: 'MONO', ui-monospace, Consolas, monospace; font-weight: 500; font-size: 16px; fill: #8394a6; }
      .est { font-family: 'MONO', ui-monospace, Consolas, monospace; font-weight: 500; font-size: 13px; fill: #52657a; letter-spacing: 1px; }
    </style>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#9fd3f0" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="edge" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8cc8ec" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#8cc8ec" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#8cc8ec" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="839" height="179" rx="12" fill="#0b131c" stroke="#1c2b3a"/>
  <rect x="0.5" y="0.5" width="839" height="179" rx="12" fill="url(#dots)"/>
  <rect x="24" y="178.5" width="792" height="1" fill="url(#edge)"/>
  <text x="46" y="102" class="name"><tspan fill="#8cc8ec">Fire</tspan><tspan fill="#e6edf3">Stund</tspan><tspan fill="#8cc8ec">_<animate attributeName="fill-opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  <text x="49" y="142" class="tag">quietly building.</text>
  <text x="800" y="142" class="est" text-anchor="end">est. 2020</text>
</svg>
